name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ogsr_engine/**"
      - "3rd_party/Src/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build OGSR2 Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential git zip unzip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform, build tools and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Fetch Android build dependencies
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/3rd_party/Src"

          # Full clone of a branch/tag into a clean folder.
          clone() { rm -rf "$3"; git clone -q --depth 1 --branch "$2" "$1" "$3"; }
          # Only one sub-folder of a big repo (headers of SDKs whose libraries Android never links).
          sparse() {
            rm -rf "$3"
            git clone -q --depth 1 --filter=blob:none --sparse --branch "$2" "$1" "$3"
            git -C "$3" sparse-checkout set "$4"
          }

          # SDL2 / OpenAL Soft: source trees for OGSR_SDL2_DIR / OGSR_OPENAL_DIR
          mkdir -p "$GITHUB_WORKSPACE/.deps"
          clone https://github.com/libsdl-org/SDL.git      release-2.30.11 "$GITHUB_WORKSPACE/.deps/SDL2-2.30.11"
          clone https://github.com/kcat/openal-soft.git    1.24.3          "$GITHUB_WORKSPACE/.deps/openal-soft-1.24.3"

          # The same set Update_Components.cmd downloads on Windows. The repository only holds
          # CMakeLists/props stubs for these; the sources come from here.
          clone https://github.com/cameron314/concurrentqueue.git master "$D/concurrentqueue/concurrentqueue"
          clone https://github.com/AgentD/squashfs-tools-ng.git   master "$D/libsquashfs/squashfs-tools-ng"
          clone https://github.com/lz4/lz4.git                    dev    "$D/lz4/lz4"
          clone https://github.com/facebook/zstd.git              dev    "$D/zstd/zstd"
          clone https://github.com/tzcnt/cpputils.git             main   "$D/cpputils/cpputils"
          clone https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git master \
            "$D/VulkanMemoryAllocator/VulkanMemoryAllocator"

          # mimalloc (this missing folder was the CMake error at CMakeLists.txt:73).
          clone https://github.com/microsoft/mimalloc.git dev2 "$D/mimalloc/mimalloc"
          # Our patch (guard page counted into mi_usable_size) has been fixed upstream in current dev2, and no longer
          # applies there. Apply it only while it still fits; otherwise upstream already has the fix.
          PATCH="$D/mimalloc/patches/0001-guarded-usable-size-without-padding.patch"
          if git -C "$D/mimalloc/mimalloc" apply --check "$PATCH" 2>/dev/null; then
            git -C "$D/mimalloc/mimalloc" apply "$PATCH"
            echo "mimalloc: local patch applied"
          else
            echo "mimalloc: patch not needed / does not apply to this dev2 (fixed upstream), skipped"
          fi

          # Headers only: the Vulkan renderer lists these include folders in its CMake and #includes them.
          sparse https://github.com/NVIDIA/DLSS.git                              v310.4.0 "$D/NVIDIA_DLSS/DLSS"       include
          sparse https://github.com/NVIDIAGameWorks/Streamline.git               v2.12.0  "$D/NVIDIA_Streamline"      include
          sparse https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git  v1.1.4   "$D/AMD_FidelityFX"         sdk/include

          # Folders the engine's CMake adds with add_subdirectory
          clone https://gitlab.freedesktop.org/freetype/freetype.git VER-2-13-3 "$D/freetype"
          clone https://github.com/mikke89/RmlUi.git                 6.2        "$D/RmlUi"

          # Fail here, with a readable message, instead of 700 lines later inside CMake.
          for p in mimalloc/mimalloc zstd lz4 libsquashfs freetype RmlUi Xiph/libogg Xiph/libvorbis Xiph/libtheora lzo ode imgui; do
            test -f "$D/$p/CMakeLists.txt" || { echo "::error::missing $D/$p/CMakeLists.txt"; exit 1; }
          done
          test -f "$D/NVIDIA_Streamline/include/sl.h"
          test -f "$D/NVIDIA_DLSS/DLSS/include/nvsdk_ngx_vk.h"
          test -f "$D/AMD_FidelityFX/sdk/include/FidelityFX/host/ffx_fsr3upscaler.h"

      - name: Configure Android ARM64 engine
        run: |
          cmake -S ogsr_engine -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DOGSR_SDL2_DIR="$GITHUB_WORKSPACE/.deps/SDL2-2.30.11" \
            -DOGSR_OPENAL_DIR="$GITHUB_WORKSPACE/.deps/openal-soft-1.24.3" \
            -DOGSR_WITH_GNS=OFF

      - name: Compile engine
        run: cmake --build build-android --target xr_3da --parallel 4

      - name: Package and sign APK
        shell: bash
        run: |
          set -euo pipefail

          SRC="$GITHUB_WORKSPACE/ogsr_engine/android"
          SDL_JAVA="$GITHUB_WORKSPACE/.deps/SDL2-2.30.11/android-project/app/src/main/java"
          BUILD="$GITHUB_WORKSPACE/build-android"
          SDK="$ANDROID_HOME"
          NDK="$ANDROID_NDK_HOME"
          BT="$SDK/build-tools/36.0.0"
          PLATFORM_JAR="$SDK/platforms/android-34/android.jar"
          T="$RUNNER_TEMP/ogsr-apk"
          OUT="$GITHUB_WORKSPACE/dist"

          test -f "$SRC/AndroidManifest.xml"
          test -f "$SRC/java/com/ogsr/online/OgsrActivity.java"
          test -f "$SRC/res/mipmap-mdpi/ic_launcher.png"
          test -f "$BUILD/xr_3da/libmain.so"
          test -f "$BUILD/SDL2/libSDL2.so"

          rm -rf "$T" "$OUT"
          mkdir -p "$T/classes" "$T/dex" "$T/pkg/lib/arm64-v8a" "$OUT"

          mapfile -t JAVA_FILES < <(find "$SDL_JAVA" "$SRC/java" -name '*.java' -print)
          javac -encoding UTF-8 -nowarn -Xlint:-options \
            -source 8 -target 8 \
            -bootclasspath "$PLATFORM_JAR:$BT/core-lambda-stubs.jar" \
            -classpath "$PLATFORM_JAR" \
            -d "$T/classes" "${JAVA_FILES[@]}"

          mapfile -t CLASS_FILES < <(find "$T/classes" -name '*.class' -print)
          "$BT/d8" --release --min-api 29 --lib "$PLATFORM_JAR" \
            --output "$T/dex" "${CLASS_FILES[@]}"

          "$BT/aapt2" compile --dir "$SRC/res" -o "$T/launcher-res.zip"
          mkdir -p "$T/compiled-res"
          (cd "$T/compiled-res" && unzip -q "$T/launcher-res.zip")
          RES_ARGS=()
          while IFS= read -r -d '' resource; do
            RES_ARGS+=(-R "$resource")
          done < <(find "$T/compiled-res" -name '*.flat' -print0)

          "$BT/aapt2" link -o "$T/base.apk" \
            --manifest "$SRC/AndroidManifest.xml" \
            -I "$PLATFORM_JAR" \
            --min-sdk-version 29 \
            --target-sdk-version 34 \
            "${RES_ARGS[@]}"

          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          cp "$BUILD/xr_3da/libmain.so" \
             "$BUILD/SDL2/libSDL2.so" \
             "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
             "$T/pkg/lib/arm64-v8a/"
          "$STRIP" --strip-unneeded "$T"/pkg/lib/arm64-v8a/*.so

          cp "$T/dex/classes.dex" "$T/pkg/"
          (cd "$T/pkg" && zip -q -r "$T/base.apk" classes.dex lib)

          "$BT/zipalign" -f -P 16 4 "$T/base.apk" "$T/aligned.apk"

          keytool -genkeypair \
            -keystore "$T/ogsr-debug.keystore" \
            -storepass android -keypass android \
            -alias ogsr -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=OGSR Debug" >/dev/null

          "$BT/apksigner" sign \
            --ks "$T/ogsr-debug.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --out "$OUT/S.T.A.L.K.E.R-OGSR2-arm64-v8a.apk" \
            "$T/aligned.apk"

          "$BT/apksigner" verify --verbose "$OUT/S.T.A.L.K.E.R-OGSR2-arm64-v8a.apk"
          ls -lh "$OUT/S.T.A.L.K.E.R-OGSR2-arm64-v8a.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: S.T.A.L.K.E.R-OGSR2-Android-APK
          path: dist/S.T.A.L.K.E.R-OGSR2-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
